<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form class="form" action="#" method="post">
    <h2>Create Account</h2>

    <label for="name">Full Name</label>
    <input type="text" id="name" placeholder="Alex Johnson" required>

    <label for="email">Email</label>
    <input type="email" id="email"  placeholder="alex@example.com" required>

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="At least 8 characters" required>

    <label for="confirm">Confirm Password</label>
    <input type="password" id="confirm" placeholder="Repeat password" required>

    <div class="terms">
      <input type="checkbox" id="terms" required>
      <label for="terms">I agree to the Terms &amp; Conditions</label>
    </div>

    <button type="submit">Register</button>

    <p class="login">Already have an account? <a href="#">Log in</a></p>
  </form>
</body>
</html>
